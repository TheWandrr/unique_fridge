[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unique-fridge"
version = "0.1.0"
description = "Validated BLE client for the characterized portable refrigerator protocol"
requires-python = ">=3.11"
dependencies = ["bleak>=0.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["unique_fridge*"]
